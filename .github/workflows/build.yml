name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup SDK
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          # Descarcă SDK-ul ca arhivă de pe GitHub pentru a evita eroarea "Unrecognized archive format"
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz -o iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Tweak
        run: |
          # THEOS este deja setat în GITHUB_ENV, deci make va funcționa direct
          make
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneState-Dylib
          path: |
            .theos/obj/debug/*.dylib
            packages/*.deb
