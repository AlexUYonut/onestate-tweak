name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          # Instalăm ldid pentru a putea semna binarul final
          brew install ldid
          # Clonăm Theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup SDK
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          # Folosim git clone pentru SDK pentru a evita erorile de arhivă dezarhivată prost
          git clone --depth 1 https://github.com/theos/sdks.git temp_repo
          mv temp_repo/iPhoneOS14.5.sdk ./
          rm -rf temp_repo

      - name: Build Tweak
        run: |
          # Compilăm tweak-ul
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneState-Final-Build
          path: |
            ./packages/*.deb
            ./.theos/obj/*.dylib
            ./*.dylib
