name: Build OneState Ultra Hack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          # Folosim link-ul direct de download care a functionat
          sudo mkdir -p $THEOS/sdks
          sudo curl -kLO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          sudo tar -xf iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks/
          
      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          make clean
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: OneStateUltra-Build
          path: packages/*.deb
