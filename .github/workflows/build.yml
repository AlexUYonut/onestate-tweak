name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Setup SDK
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git temp_repo
          mv temp_repo/iPhoneOS14.5.sdk ./
          rm -rf temp_repo

      - name: Build Tweak
        run: |
          # Curățăm build-urile vechi de 4KB
          make clean
          # Forțăm crearea pachetului final
          make package FINALPACKAGE=1
          # Listăm fișierele pentru a vedea dacă binarul există
          ls -R .theos/obj/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneState-Final-Package
          # Căutăm orice .deb sau .dylib generat
          path: |
            packages/*.deb
            **/*.dylib
